# Business partners.
#
# One table for every subject the company deals with — customers, suppliers,
# members, employees, contacts — because the same person or firm is routinely
# more than one of those, and separate tables would mean entering them twice
# and letting their addresses drift apart.
#
# What separates them is not the table but the *view*: each role gets its own
# menu entry, with a fixed `domain` on `roles` and `defaults` that stamps the
# role on insert. The model stays single; the UI stays distinct.
#
# The table is deliberately lean. Role-specific fields — agent code, payment
# terms, credit limit — are added by the plugins that need them, through
# deep_merge, and the result is a flat table with many nullable columns. That
# is the intended shape: nullable columns cost nothing in SQL, while satellite
# tables would cost a join and a sub-form for every role.
#
# Invariant that keeps it sane: **role-specific columns are always nullable in
# the schema**. Requiredness belongs to the view, as a reactive `required`, not
# to the database — a NOT NULL column of one role would stop the records of
# every other role from being created at all.
#
# The same holds for the optional columns of the base table, and it needs no
# declaration: a column that says nothing is nullable. The one mandatory column
# is `name`, and it says so through its type — `Name` is a `Description`, which
# is what a value no record can be without looks like.
#
# Two things are deliberately *not* here, recorded so they are not added back:
#
#   - No registry-wide `code`. A subject holds several roles at once, so one
#     column could not carry both the member number and the employee number of
#     the same person. Role plugins declare their own, and they are separate
#     columns precisely because they are separate things.
#
#   - No `merged_into` pointer. A column that only means something together
#     with the command maintaining it belongs with that command — here it would
#     be inert, and an inert column invites a half-implemented merge. It comes
#     back, by deep_merge, with the plugin that can actually unify duplicates.

tables:

  Partner:
    name: partners
    label: "Partner"
    help: |
      Any subject the company deals with. Roles (customer, supplier, member…)
      are held in `roles` as a delimited set, so one subject can be several
      things at once without being entered twice.
    tags: [master]
    mixins: [TimeStamp, Archivable]

    columns:

      - name: id
        type: ID

      # What the subject is: `person` | `organization`.
      #
      # A closed set, owned by the code — the opposite of `roles` below, which
      # an application extends. It is the one shared discriminator: the form
      # reads it to render one "Name" box or two, `title` applies only to a
      # person, birth data and legal form are mutually exclusive on it, the
      # correspondence differs, and the privacy obligations differ. It lives in
      # the base table so that all of them get the *same* answer — a plugin
      # forced to infer it (from a comma in the name, from the presence of a VAT
      # number) would eventually disagree with another plugin about one record.
      #
      # Nor can the view decide it: the same subject is opened from the customer
      # list and from the members list, and must render the same either way.
      # How a record shows itself comes from the record, not from the view — the
      # single table would be pointless otherwise.
      #
      # Exactly one value means a natural person: `person`. Write the test on
      # that side — `kind == 'person'` for the person branch, everything else
      # for the rest — because new kinds (public body, group) are non-persons,
      # so a rule written before they existed still puts them where they belong.
      # A sole trader is `person`: legally it is one, and it invoices as
      # "Smith, John" even when the shop sign reads otherwise.
      #
      # Legal form (Ltd, Inc, association) does NOT belong in this column: it is
      # a property *of* an organization, not an alternative to being one, and
      # its values are an open set that varies by country. Putting it here would
      # silently break every rule written as `kind == 'organization'` the day
      # the first `ltd` was stored. It gets its own `legal_form` column when it
      # is needed — as a lookup whose rows state the `kind` they imply, so the
      # two refine each other instead of drifting apart.
      #
      # Nullable because a child row that is only an address is neither. It is
      # required for top-level subjects, and that is expressed in the view as a
      # reactive `required` on `parent_id == null`, not as a NOT NULL here.
      - name: kind
        type: ShortStr
        label: "Kind"

      # Official designation, and the display field everywhere.
      #
      # For an organization it is the registered name, typed. For a person it
      # is "Surname, Given" — the comma makes the split deterministic in both
      # directions, which is why the parts are not stored separately: composing
      # is always possible, and with the comma so is decomposing.
      #
      # It is also the fiscally correct name: a sole trader invoices as
      # "Smith, John" even when the shop sign reads otherwise.
      - name: name
        type: Name
        label: "Name"

      # Shop sign / trading name, when it differs from the registered one.
      # Searchable, but never the display: whoever types "Riverside Hardware"
      # finds the record and is shown "Smith, John".
      - name: trade_name
        type: String
        label: "Trade name"

      - name: title
        type: ShortStr
        label: "Title"
        help: "Mr., Mrs., Dr. — free text, suggestions come from the view"

      # Roles held, as a delimited set: ",C,S," — never packed characters.
      #
      # Delimiters are not decoration: searching ",C," can never match ",CO,",
      # whereas "C" inside "CS" would match the first two-character code added
      # and break every existing filter without a word of warning.
      #
      # A set rather than one column per role, because a new role must be a new
      # row in `PartnerRole`, not an ALTER on a shared table. A set rather than
      # a single code, because a subject really is customer and supplier at once.
      #
      # Not indexed: a LIKE with a leading wildcard would not use the index.
      - name: roles
        type: String
        length: 255
        label: "Roles"

      # Parent subject, for rows that hang off another one: a contact person,
      # a delivery address, a billing address. Qualified by `usage` below.
      - name: parent_id
        label: "Belongs to"
        foreign_key:
          target: Partner.id
          # `backref` because the generated name would be `partners_parent`:
          # correct and unreadable. `relation` is the default here (the column
          # minus its suffix), stated so the pair reads as one declaration.
          relation: parent
          backref: children

      # What a child row is, relative to its parent:
      #   contact | invoice | delivery | operational
      # Empty for top-level subjects. Kept apart from `kind` because the two
      # answer different questions — what the row *is* versus how it is *used*.
      #
      # A closed set owned by the code, hence a plain column and not a registry
      # like `PartnerRole`: invoice printing looks for `invoice`, shipping looks for
      # `delivery`, and a value no code knows about is inert. A registry would
      # promise an extensibility that does not exist and charge a join on every
      # child row for it. `roles` is the other case, and gets the other answer.
      #
      # The values are offered by the view as a fixed choice. When the schema
      # grows a declarative `values:` on a column, that is where they belong.
      - name: usage
        type: ShortStr
        label: "Usage"

      # Here rather than in a fiscal plugin because they identify the subject,
      # the way the name does, and because the duplicate check on save is a
      # property of the registry itself. What *is* country-specific — the
      # checksum, the format, which of the two is mandatory — is validation, and
      # that a plugin can add without owning the column.
      #
      # Neither is unique: foreign subjects have no domestic VAT number, private
      # individuals have no VAT number at all, and duplicates legitimately exist
      # until someone unifies them. They are indexed and drive the duplicate
      # warning on save.
      - name: vat_number
        type: Code
        label: "VAT number"

      - name: tax_code
        type: Code
        label: "Tax code"

      # Main address, inline. Additional addresses are child rows with a
      # `usage`, which is why there is no address table: a child row already
      # carries a full address, a name and its own channels.
      - name: address
        type: Address

      # Primary channels inline — searched, exported and printed without a
      # join. Further ones are child rows, same as addresses.
      - name: email
        type: Email
        label: "Email"

      - name: phone
        type: Phone
        label: "Phone"

      - name: mobile
        type: Phone
        label: "Mobile"

      - name: website
        type: URL
        label: "Website"

      - name: notes
        type: Markdown
        label: "Notes"

  # `PartnerRole` and not `Role`: authorisation roles will want that name, and
  # two plugins declaring the same table are folded into one by deep_merge
  # without a warning.
  #
  # Roles are declared by the application in its `data:` section and reconciled
  # here at startup; one that nobody declares is inert, since no view filters on
  # it and no default stamps it. Reconciliation writes only the declared keys,
  # and never deletes a row: a dropped row would leave its code inside the
  # `roles` of existing partners with nothing left to name it.
  #
  # A `defaults` JSON column belongs here — values to stamp on the partner when
  # the role is attached, filling only what is still empty. It arrives with the
  # behaviour that applies it.
  PartnerRole:
    name: partner_roles
    label: "Partner role"
    help: |
      The roles a partner may hold. Each row's code is what is stored inside
      `Partner.roles`: this table is the vocabulary that views, domains and
      defaults are written against.
    tags: [reference]

    columns:

      # The code is the key: it is the value stored inside Partner.roles.
      - name: id
        type: ShortID
        label: "Code"

      - name: label
        type: Description
        label: "Label"

      # Display order, and the tie-break when two roles of the same partner
      # would fill the same field: the one listed first wins.
      #
      # Never declared in a plugin's `data:` — numbers picked by two plugins
      # collide with nothing to arbitrate them. A declaration carries the
      # position instead (`$after` / `$before`) and the loader turns it into a
      # number on first insert; from then on it is the user's, and a reordering
      # from the UI is never overwritten.
      # Declared rather than left optional: it always has a value (the loader
      # assigns one on insert, the default covers the rest) and a NULL would
      # order the list differently on every database.
      - name: sequence
        type: Integer
        label: "Sequence"
        default: 0
        nullable: false
        help: "Display order; also decides which role wins when two would fill the same field"
