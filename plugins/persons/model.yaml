# Registry data of a natural person, merged into `Partner`.
#
# Nullable throughout: the same table holds organizations, and a partner created
# from a customer list is asked none of this. The view makes the section visible
# on `kind == 'person'` and requires what it needs.
#
# Deliberately not here: the place of birth, which in the form that is useful is
# a coded municipality and so belongs to the country plugin that owns the
# lookup; and a separate fiscal sex, since `gender` in the base is the one axis
# and a calculator that needs `M` or `F` treats anything else as validation.
# config.yaml says where the line between this plugin and `partners` falls.

tables:

  Partner:

    columns:

      # Not recycled for the incorporation date of an organization: the two are
      # never the same question — every query would have to filter on `kind` to
      # avoid catching the other population — and they do not carry the same
      # privacy weight. An organization gets `founded_on` when something reads
      # it.
      - name: birth_date
        type: Date
        label: "Date of birth"

      # Coded because things compute on it: the VAT prefix and the country of an
      # e-invoice speak alpha-2. Two characters wide so the schema itself
      # refuses the other coding — `IT` and `ITA` are one country that no filter
      # matches twice. The country of an address is free text instead, being
      # read rather than computed with.
      #
      # A plain code and not a foreign key: the country registry is a table this
      # plugin does not have and should not invent. When it arrives it declares
      # the foreign key on this same column by deep_merge.
      - name: citizenship
        type: UpperStr
        length: 2
        label: "Citizenship"
        help: "ISO 3166-1 alpha-2 country code"
